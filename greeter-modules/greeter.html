<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Greeter — Blake Rossi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../project-theme.css" />
  <link rel="stylesheet" href="styles/default-styles.css" />

  <style>
    body {
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 3rem 2rem;
      max-width: 500px;
    }
    .button-row {
      display: flex;
      gap: 0.65rem;
    }
    /* override default-styles.css heading */
    header h1, h1 {
      font-family: 'Syne', sans-serif !important;
      background: none !important;
      color: rgba(255,255,255,0.95) !important;
      padding: 0 !important;
      text-align: left !important;
      font-size: 1.4rem !important;
    }
    /* override default-styles.css sizing */
    button, input, p { font-size: 0.9rem !important; }
    input[type=text], #input-firstname {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.5rem;
      padding: 0.45rem 0.85rem;
      outline: none;
      width: 100%;
    }
    #input-firstname:focus { border-color: rgba(255,255,255,0.3); }
    #output {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem !important;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: rgba(255,255,255,0.9);
    }
    footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      padding: 1.5rem 2rem 2rem;
      font-style: normal;
      width: auto;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-row label {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>

  <header class="project-header">
    <a class="project-header__back" href="../index.html">← IGME-330</a>
    <div class="project-header__divider"></div>
    <p class="project-header__title">Webpack Greeter</p>
    <div class="project-header__tags">
      <span class="project-tag">Webpack</span>
      <span class="project-tag">ES Modules</span>
      <span class="project-tag">JavaScript</span>
    </div>
  </header>

  <main>
    <div class="button-row">
      <button id="btn-hello">Hello</button>
      <button id="btn-goodbye">Goodbye</button>
    </div>
    <input id="input-firstname" type="text" placeholder="Type in your name">
    <div class="checkbox-row">
      <input type="checkbox" id="cb-forcefully">
      <label for="cb-forcefully">Forcefully</label>
    </div>
    <p id="output">???</p>
  </main>

  <footer>&copy; 2022 Ace Coder</footer>

  <script src="dist/bundle.js"></script>
</body>
</html>
